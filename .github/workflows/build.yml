name: Validate and build macOS ARM64
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  media-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install FFmpeg from Ubuntu repositories only
        timeout-minutes: 8
        run: |
          if test -x /usr/bin/ffmpeg && test -x /usr/bin/ffprobe && command -v cmake >/dev/null && command -v c++ >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
      - run: cargo fmt --manifest-path crates/media-core/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/media-core/Cargo.toml --locked -- --include-ignored --skip real_english_speech_timestamps_restore_chunking_and_cancel --skip real_qwen_semantic_linking_and_rejection
        env:
          AI_CLIPPER_TEST_FFMPEG: /usr/bin/ffmpeg
          AI_CLIPPER_TEST_FFPROBE: /usr/bin/ffprobe
  speech-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install speech test dependencies
        timeout-minutes: 8
        run: |
          if test -x /usr/bin/ffmpeg && test -x /usr/bin/ffprobe && command -v cmake >/dev/null && command -v c++ >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg cmake build-essential
      - uses: actions/cache/restore@v4
        id: whisper-cache
        with:
          path: src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu
          key: linux-whisper-${{ hashFiles('scripts/build-whisper.sh') }}
      - if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-whisper.sh
      - if: steps.whisper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu
          key: linux-whisper-${{ hashFiles('scripts/build-whisper.sh') }}
      - uses: actions/cache/restore@v4
        id: whisper-model-cache
        with:
          path: ${{ runner.temp }}/whisper-data/models
          key: whisper-model-${{ hashFiles('crates/media-core/src/models.rs') }}
      - name: Download and verify the actual base.en model with the app downloader
        run: cargo run --manifest-path crates/media-core/Cargo.toml --locked --example download_model -- "$RUNNER_TEMP/whisper-data"
      - if: steps.whisper-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/whisper-data/models
          key: whisper-model-${{ hashFiles('crates/media-core/src/models.rs') }}
      - name: Recognize real English speech and verify persistence and cancellation
        run: cargo test --manifest-path crates/media-core/Cargo.toml --locked --test transcription real_english_speech_timestamps_restore_chunking_and_cancel -- --include-ignored
        env:
          AI_CLIPPER_TEST_FFMPEG: /usr/bin/ffmpeg
          AI_CLIPPER_TEST_FFPROBE: /usr/bin/ffprobe
          AI_CLIPPER_TEST_WHISPER: ${{ github.workspace }}/src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu
          AI_CLIPPER_TEST_MODEL_ROOT: ${{ runner.temp }}/whisper-data
          AI_CLIPPER_TEST_TRANSCRIPT_OUTPUT: ${{ runner.temp }}/real-english-transcript.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-english-transcript
          path: ${{ runner.temp }}/real-english-transcript.json
          retention-days: 14
  scene-tests:
    needs: [speech-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native inference build tools
        timeout-minutes: 8
        run: |
          if command -v cmake >/dev/null && command -v c++ >/dev/null; then
            cmake --version | head -1
            exit 0
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake build-essential
      - uses: actions/cache/restore@v4
        id: llama-cache
        with:
          path: src-tauri/binaries/llama-completion-x86_64-unknown-linux-gnu
          key: linux-llama-${{ hashFiles('scripts/build-llama.sh') }}
      - if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama.sh
      - if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src-tauri/binaries/llama-completion-x86_64-unknown-linux-gnu
          key: linux-llama-${{ hashFiles('scripts/build-llama.sh') }}
      - uses: actions/cache/restore@v4
        id: qwen-cache
        with:
          path: ${{ runner.temp }}/qwen-data/models
          key: qwen-model-${{ hashFiles('crates/media-core/src/models.rs') }}
      - name: Download and verify pinned Qwen with the actual app downloader
        run: cargo run --manifest-path crates/media-core/Cargo.toml --locked --example download_model -- "$RUNNER_TEMP/qwen-data" qwen
      - if: steps.qwen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qwen-data/models
          key: qwen-model-${{ hashFiles('crates/media-core/src/models.rs') }}
      - uses: actions/download-artifact@v4
        with:
          name: real-english-transcript
          path: ${{ runner.temp }}/speech-fixture
      - name: Actual Qwen inference, distant relationship and unrelated negative control
        run: cargo test --manifest-path crates/media-core/Cargo.toml --locked --test analysis real_qwen_semantic_linking_and_rejection -- --include-ignored --nocapture
        env:
          AI_CLIPPER_TEST_LLAMA: ${{ github.workspace }}/src-tauri/binaries/llama-completion-x86_64-unknown-linux-gnu
          AI_CLIPPER_TEST_QWEN_ROOT: ${{ runner.temp }}/qwen-data
          AI_CLIPPER_TEST_TRANSCRIPT: ${{ runner.temp }}/speech-fixture/real-english-transcript.json
  macos-arm64:
    needs: [frontend, media-tests, speech-tests, scene-tests]
    # Standard Intel runner: free for this public repository.
    # Cross-compile on macOS with Xcode; the output still targets Apple Silicon.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt
      - run: npm ci
      - run: npm run build
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            src-tauri/binaries/*-apple-darwin
            src-tauri/third-party/
          key: macos-native-${{ hashFiles('scripts/build-ffmpeg-macos.sh', 'scripts/build-whisper.sh', 'scripts/build-llama.sh', 'licenses/*') }}
      - if: steps.native-cache.outputs.cache-hit != 'true'
        name: Build bundled LGPL FFmpeg and FFprobe for Intel and ARM64
        run: bash scripts/build-ffmpeg-macos.sh
      - if: steps.native-cache.outputs.cache-hit != 'true'
        name: Build static whisper.cpp with embedded Metal support
        run: bash scripts/build-whisper.sh
      - if: steps.native-cache.outputs.cache-hit != 'true'
        name: Build static llama.cpp with embedded Metal support
        run: bash scripts/build-llama.sh
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/binaries/*-apple-darwin
            src-tauri/third-party/
          key: macos-native-${{ hashFiles('scripts/build-ffmpeg-macos.sh', 'scripts/build-whisper.sh', 'scripts/build-llama.sh', 'licenses/*') }}
      - name: Smoke-test bundled Intel FFmpeg filter graph
        run: |
          src-tauri/binaries/ffprobe-x86_64-apple-darwin -v error -show_entries format=duration -of json tests/fixtures/sample.mp4
          src-tauri/binaries/ffmpeg-x86_64-apple-darwin -v error -xerror -threads 2 -filter_threads 1 -i tests/fixtures/sample.mp4 -t 2 -vf "scale=w='ceil(iw*sar/2)*2':h=ih,setsar=1,crop=w='floor(min(iw,ih*9/16)/2)*2':h='floor(min(ih,iw*16/9)/2)*2':x='(iw-ow)/2':y='(ih-oh)/2',scale=1080:1920:flags=bilinear,setsar=1,fps=30" -af apad -f null -
      - name: Verify bundled audio extraction for Whisper
        run: |
          src-tauri/binaries/ffmpeg-x86_64-apple-darwin -v error -i tests/fixtures/sample.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le -f wav "$RUNNER_TEMP/whisper-audio.wav"
          src-tauri/binaries/ffprobe-x86_64-apple-darwin -v error -show_streams -of json "$RUNNER_TEMP/whisper-audio.wav" > "$RUNNER_TEMP/audio-info.json"
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1])).streams[0]; if(s.sample_rate!=="16000"||s.channels!==1||s.codec_name!=="pcm_s16le") process.exit(1)' "$RUNNER_TEMP/audio-info.json"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # Run tests on the Intel host; ARM64 test binaries cannot run here.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify the actual application can start its Whisper sidecar
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          smoke_dir="$RUNNER_TEMP/AI Clipper smoke.app/Contents/MacOS"
          mkdir -p "$smoke_dir"
          cp src-tauri/target/debug/ai-clipper "$smoke_dir/ai-clipper"
          cp src-tauri/binaries/whisper-cli-x86_64-apple-darwin "$smoke_dir/whisper-cli"
          cp src-tauri/binaries/llama-completion-x86_64-apple-darwin "$smoke_dir/llama-completion"
          cd "$RUNNER_TEMP"
          "$smoke_dir/ai-clipper" --check-whisper
          "$smoke_dir/ai-clipper" --check-llama
      - name: Build ad-hoc signed Apple Silicon application
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Verify ARM64 app and disk image
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AI Clipper.app"
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          executable_path="$app_path/Contents/MacOS/$executable_name"
          file "$executable_path"
          test "$(lipo -archs "$executable_path")" = "arm64"
          codesign --verify --deep --strict "$app_path"
          for tool in ffmpeg ffprobe whisper-cli llama-completion; do
            test "$(lipo -archs "$app_path/Contents/MacOS/$tool")" = "arm64"
            codesign --verify --strict "$app_path/Contents/MacOS/$tool"
          done
          test -s "$app_path/Contents/Resources/third-party/ffmpeg-source.tar.gz"
          test -s "$app_path/Contents/Resources/third-party/FFmpeg-LGPL-2.1.txt"
          test -s "$app_path/Contents/Resources/third-party/Whisper-MIT-LICENSE.txt"
          test -s "$app_path/Contents/Resources/third-party/Llama-MIT-LICENSE.txt"
          test -s "$app_path/Contents/Resources/third-party/Qwen-Apache-2.0.txt"
          for dmg_path in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg_path"
            mount_dir="$RUNNER_TEMP/AI Clipper mounted"
            mkdir -p "$mount_dir"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path"
            test "$(lipo -archs "$mount_dir/AI Clipper.app/Contents/MacOS/llama-completion")" = "arm64"
            # Intel cannot execute ARM64. Test the DMG bundle layout using host binaries
            # in a separate copy; never mutate the delivered ARM64 application.
            package_smoke="$RUNNER_TEMP/AI Clipper package smoke.app"
            ditto "$mount_dir/AI Clipper.app" "$package_smoke"
            hdiutil detach "$mount_dir"
            cp src-tauri/target/debug/ai-clipper "$package_smoke/Contents/MacOS/$executable_name"
            cp src-tauri/binaries/llama-completion-x86_64-apple-darwin "$package_smoke/Contents/MacOS/llama-completion"
            codesign --force --deep --sign - "$package_smoke"
            (cd "$RUNNER_TEMP" && "$package_smoke/Contents/MacOS/$executable_name" --check-llama)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Clipper-macOS-ARM64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
