[package]
name = "ai-clipper"
version = "0.4.0"
description = "Local video workspace for Apple Silicon"
authors = ["AI Clipper contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ai_clipper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

clipper-media = { path = "../crates/media-core" }
serde = { version = "1", features = ["derive"] }
